<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MOA · Registo de Presença</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* A escala é controlada pelo font-size do html — tudo em rem */
html { font-size: 16px; } /* sobrescrito pelo JS de auto-escala */

body {
  font-family: "DM Sans", system-ui, sans-serif;
  background: #f2f2f7;
  overflow-y: auto;
  overflow-x: hidden;
}

/* HEADER */
header {
  background: #fff;
  border-bottom: 0.1rem solid rgba(0,0,0,0.08);
  padding: 0.9rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo-area { display: flex; align-items: center; gap: 1.2rem; }
.logo-area img { height: 4rem; width: auto; display: block; }
.logo-div { width: 0.1rem; height: 2.8rem; background: rgba(0,0,0,0.1); flex-shrink: 0; }
.logo-sub { font-size: 1rem; font-weight: 500; color: #8e8e93; }
.clock-area { text-align: right; }
#relogio { font-size: 2.8rem; font-weight: 300; color: #1c1c1e; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
#data-hoje { font-size: 0.8rem; color: #8e8e93; margin-top: 0.2rem; }

/* ZOOM CONTROL */
#zoom-ctrl {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: 1.2rem;
}
.zoom-btn {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  border: 0.1rem solid rgba(0,0,0,0.12);
  background: #f2f2f7;
  font-size: 1.1rem;
  font-weight: 700;
  color: #3c3c43;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "DM Sans", sans-serif;
  flex-shrink: 0;
}
.zoom-btn:active { background: #e5e5ea; }
#zoom-val { font-size: 0.75rem; color: #8e8e93; min-width: 2.5rem; text-align: center; }

/* CORPO */
#corpo {
  display: flex;
  align-items: flex-start;
  padding: 1.2rem 1rem;
  gap: 1rem;
}

/* COLUNA ESQUERDA */
#col-esq { flex: 1; display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; }
.secao-label { font-size: 0.65rem; font-weight: 700; color: #8e8e93; letter-spacing: 0.1em; text-transform: uppercase; }
#grid-colabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

.btn-colab {
  background: #fff;
  border: 0.15rem solid transparent;
  border-radius: 1.1rem;
  padding: 1.1rem 1rem;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 0.1rem 0.4rem rgba(0,0,0,0.08);
  outline: none;
  width: 100%;
  display: block;
  transition: transform 0.1s;
}
.btn-colab:active { transform: scale(0.97); }
.btn-colab.sel     { background: #1a3d1f; border-color: #1a3d1f; box-shadow: 0 0.3rem 1rem rgba(26,61,31,0.28); }
.btn-colab.pausa-c { background: #fff8f0; }
.ch { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.3rem; }
.dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; flex-shrink: 0; }
.d-livre { background: #c7c7cc; } .d-turno { background: #34c759; } .d-pausa { background: #ff9500; } .d-sel { background: #93C47D; }
.cn { font-size: 1.05rem; font-weight: 700; color: #1c1c1e; letter-spacing: -0.01em; }
.btn-colab.sel .cn { color: #fff; }
.ce { font-size: 0.78rem; padding-left: 1.15rem; }
.e-livre { color: #8e8e93; } .e-turno { color: #34c759; font-weight: 600; } .e-pausa { color: #ff9500; font-weight: 600; } .e-sel { color: #93C47D; font-weight: 600; }

/* DIVISOR */
#div-v { width: 0.1rem; background: rgba(0,0,0,0.07); align-self: stretch; flex-shrink: 0; }

/* COLUNA DIREITA */
#col-dir { width: 20rem; flex-shrink: 0; display: flex; flex-direction: column; gap: 0.8rem; }

/* DASHBOARD */
#dash { display: flex; flex-direction: column; gap: 0.8rem; }
#dash.oculto { display: none; }
.activo-card { background: #fff; border-radius: 0.8rem; padding: 0.8rem 0.9rem; box-shadow: 0 0.05rem 0.2rem rgba(0,0,0,0.06); }
.activo-card.p { background: #fff8f0; }
.ac-row { display: flex; justify-content: space-between; align-items: baseline; }
.ac-nome { font-size: 0.9rem; font-weight: 700; color: #1c1c1e; }
.ac-dur  { font-size: 0.85rem; font-weight: 700; color: #1a3d1f; }
.ac-dur-p{ font-size: 0.85rem; font-weight: 700; color: #ff9500; }
.ac-sub  { font-size: 0.7rem; color: #8e8e93; margin-top: 0.15rem; }
.ac-av   { font-size: 0.7rem; color: #ff9500; font-weight: 600; margin-top: 0.15rem; }
.sem-act { font-size: 0.8rem; color: #c7c7cc; }
#resumo-wrap { background: #fff; border-radius: 0.8rem; overflow: hidden; box-shadow: 0 0.05rem 0.2rem rgba(0,0,0,0.06); }
.res-row { display: flex; justify-content: space-between; padding: 0.65rem 0.9rem; border-bottom: 0.05rem solid #f2f2f7; }
.res-row:last-child { border-bottom: none; }
.res-n { font-size: 0.82rem; color: #3c3c43; } .res-n.i { color: #c7c7cc; }
.res-t { font-size: 0.82rem; font-weight: 700; color: #1c1c1e; } .res-t.i { color: #c7c7cc; }
.tp { font-size: 0.55rem; background: rgba(255,149,0,0.12); color: #ff9500; border-radius: 0.25rem; padding: 0.1rem 0.3rem; margin-left: 0.3rem; font-weight: 700; }

/* PAINEL ACÇÃO */
#acao { display: none; flex-direction: column; gap: 0.8rem; }
#acao.visivel { display: flex; }
.ai { background: #fff; border-radius: 1rem; padding: 1rem 1.1rem; box-shadow: 0 0.1rem 0.4rem rgba(0,0,0,0.08); }
.ai-nome { font-size: 1.4rem; font-weight: 700; color: #1c1c1e; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
.ai-est-t { font-size: 0.8rem; color: #34c759; font-weight: 600; }
.ai-est-p { font-size: 0.8rem; color: #ff9500; font-weight: 600; }
.ai-est-l { font-size: 0.8rem; color: #8e8e93; }
.nota-w label { font-size: 0.6rem; font-weight: 700; color: #8e8e93; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 0.4rem; }
.nota-w input { width: 100%; background: #fff; border: none; border-radius: 0.8rem; padding: 0.85rem 1rem; font-size: 0.9rem; font-family: "DM Sans", sans-serif; color: #1c1c1e; outline: none; box-shadow: 0 0.1rem 0.4rem rgba(0,0,0,0.08); }
.nota-w input::placeholder { color: #c7c7cc; }
#bts { display: flex; flex-direction: column; gap: 0.6rem; }
.ba { width: 100%; padding: 1.1rem; border: none; border-radius: 0.9rem; font-size: 1rem; font-weight: 700; font-family: "DM Sans", sans-serif; cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: block; }
.ba:active { transform: scale(0.98); opacity: 0.85; }
.ba-ent { background: #1a3d1f; color: #fff; }
.ba-pau { background: #fff; border: 0.15rem solid #ff9500 !important; color: #ff9500; }
.ba-ret { background: #ff9500; color: #fff; }
.ba-sai { background: #fff; border: 0.15rem solid rgba(0,0,0,0.14) !important; color: #3c3c43; }
.ba-can { background: transparent; border: none; padding: 0.6rem; font-size: 0.82rem; font-weight: 500; font-family: "DM Sans", sans-serif; color: #8e8e93; cursor: pointer; text-align: center; width: 100%; display: block; }

/* MODAL */
#ov-ok { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
#ov-ok.v { display: flex; }
.modal { background: #fff; border-radius: 1.4rem; padding: 2rem 1.8rem 1.5rem; max-width: 22rem; width: 88%; text-align: center; box-shadow: 0 1rem 3rem rgba(0,0,0,0.18); }
.m-ic { font-size: 3rem; margin-bottom: 0.7rem; line-height: 1; }
.m-ti { font-size: 1.3rem; font-weight: 700; color: #1c1c1e; margin-bottom: 0.3rem; }
.m-ho { font-size: 2.5rem; font-weight: 300; color: #1a3d1f; letter-spacing: -0.02em; margin: 0.5rem 0; font-variant-numeric: tabular-nums; }
.m-de { font-size: 0.85rem; color: #8e8e93; line-height: 1.5; margin-bottom: 1.2rem; }
.m-ok { background: #1a3d1f; color: #fff; border: none; border-radius: 0.8rem; padding: 1rem; font-size: 1rem; font-weight: 700; font-family: "DM Sans", sans-serif; cursor: pointer; width: 100%; }

/* ADMIN */
#btn-adm { position: fixed; bottom: 0.8rem; right: 0.8rem; background: rgba(0,0,0,0.05); border: 0.05rem solid rgba(0,0,0,0.1); border-radius: 0.5rem; padding: 0.4rem 0.7rem; font-size: 0.65rem; color: #8e8e93; cursor: pointer; font-family: "DM Sans", sans-serif; z-index: 50; }
#ov-adm { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
#ov-adm.v { display: flex; }
.adm-p { background: #fff; border-radius: 1.1rem; padding: 1.4rem; max-width: 26rem; width: 92%; max-height: 80vh; overflow-y: auto; }
.adm-ti { font-size: 1rem; font-weight: 700; color: #1c1c1e; margin-bottom: 0.8rem; }
#log-r { font-size: 0.75rem; color: #3c3c43; line-height: 2; white-space: pre-wrap; }
.le { color: #34c759; font-weight: 700; } .ls { color: #8e8e93; } .lp { color: #ff9500; font-weight: 700; } .lr { color: #007aff; font-weight: 700; }
.cw { margin-top: 0.9rem; padding-top: 0.9rem; border-top: 0.05rem solid #f2f2f7; }
.cl { font-size: 0.6rem; font-weight: 700; color: #8e8e93; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.3rem; }
.ci { width: 100%; border: 0.1rem solid #e5e5ea; border-radius: 0.6rem; padding: 0.65rem 0.8rem; font-size: 0.8rem; font-family: "DM Sans", sans-serif; color: #1c1c1e; outline: none; margin-bottom: 0.5rem; }
.ci:focus { border-color: #1a3d1f; }
.bg { background: #1a3d1f; color: #fff; border: none; border-radius: 0.6rem; padding: 0.6rem 1rem; font-size: 0.8rem; font-weight: 700; font-family: "DM Sans", sans-serif; cursor: pointer; }
#ss { font-size: 0.65rem; color: #8e8e93; margin-top: 0.3rem; }
#ss.ok { color: #34c759; }
.aa { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
.aa button { flex: 1; padding: 0.7rem; border-radius: 0.6rem; font-size: 0.8rem; font-weight: 700; font-family: "DM Sans", sans-serif; cursor: pointer; border: none; }
.ae { background: #1a3d1f; color: #fff; }
.af { background: #f2f2f7; color: #3c3c43; }
</style>
</head>

    <div class="m-ho" id="m-ho">--:--</div>
    <div class="m-de" id="m-de">—</div>
    <button class="m-ok" onclick="fModal()">OK</button>
  </div>
</div>

<button id="btn-adm" onclick="aAdm()">⚙ Admin</button>
<div id="ov-adm">
  <div class="adm-p">
    <div class="adm-ti">Painel de Administração</div>
    <div id="log-r">Sem registos hoje.</div>
    <div class="cw">
      <div class="cl">Google Sheets · Web App URL</div>
      <input class="ci" id="i-url" placeholder="https://script.google.com/macros/s/…/exec">
      <div class="cl">Email para resumo diário</div>
      <input class="ci" id="i-email" placeholder="ivo@monsantosopenair.pt">
      <button class="bg" onclick="gConfig()">Guardar</button>
      <div id="ss">Não configurado</div>
    </div>
    <div class="aa">
      <button class="ae" onclick="expCSV()">Exportar CSV</button>
      <button class="af" onclick="fAdm()">Fechar</button>
    </div>
  </div>
</div>

<script>
var KEYS  = ['Ivo Tavares','Suda Gurung','Priscila Opara','Evelise Goncalves','Vitor Ribeiro'];
var NOMES = ['Ivo Tavares','Suda Gurung','Priscila Opara','Evelise Gonçalves','Vítor Ribeiro'];

var turnos   = JSON.parse(localStorage.getItem('moa_t') || '{}');
var registos = JSON.parse(localStorage.getItem('moa_r') || '[]');
var config   = JSON.parse(localStorage.getItem('moa_c') || '{}');
var sel = null;

/* ── AUTO-ESCALA ─────────────────────────────────────────────
   Calcula o font-size base para que o layout ocupe bem o ecrã.
   Referência: desenhámos para ~1200px de largura CSS a 16px base.
   Se o ecrã for maior, escalamos proporcionalmente.
   O utilizador pode ajustar manualmente com +/- e o valor fica guardado.
*/
var ZOOM_STEP  = 2;    // px por clique
var ZOOM_MIN   = 10;
var ZOOM_MAX   = 40;
var baseAuto;          // calculado pelo ecrã

function calcAutoZoom() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  var longer = Math.max(w, h);   // landscape: é a largura
  // proporção: 1200px de referência → 16px base
  var auto = Math.round((longer / 1200) * 16);
  auto = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, auto));
  return auto;
}

function applyZoom(px) {
  document.documentElement.style.fontSize = px + 'px';
  var pct = Math.round((px / 16) * 100);
  document.getElementById('zoom-val').textContent = pct + '%';
  localStorage.setItem('moa_zoom', px);
}

function zoomAdj(dir) {
  var current = parseInt(document.documentElement.style.fontSize) || baseAuto;
  var next = current + dir * ZOOM_STEP;
  next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
  applyZoom(next);
}

function initZoom() {
  baseAuto = calcAutoZoom();
  var saved = parseInt(localStorage.getItem('moa_zoom'));
  var initial = (saved && saved >= ZOOM_MIN && saved <= ZOOM_MAX) ? saved : baseAuto;
  applyZoom(initial);
}

/* ── DADOS ───────────────────────────────────────────────── */
Object.keys(turnos).forEach(function(k){
  var t=turnos[k];
  if(t.entrada)     t.entrada     = new Date(t.entrada);
  if(t.saida)       t.saida       = new Date(t.saida);
  if(t.pausaInicio) t.pausaInicio = new Date(t.pausaInicio);
  if(t.pausas) t.pausas = t.pausas.map(function(p){ return {inicio:new Date(p.inicio),fim:p.fim?new Date(p.fim):null}; });
});

function init(){
  initZoom();
  vreset(); relo(); rColabs(); rDash(); rRes();
  setInterval(rDash, 30000);
  setInterval(rColabs, 60000);
  if(config.url)   document.getElementById('i-url').value   = config.url;
  if(config.email) document.getElementById('i-email').value = config.email;
}

function relo(){
  function tick(){
    var n=new Date();
    document.getElementById('relogio').textContent = pad(n.getHours())+':'+pad(n.getMinutes());
    document.getElementById('data-hoje').textContent = n.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
  }
  tick(); setInterval(tick,1000);
}
function pad(x){ return String(x).padStart(2,'0'); }

function rColabs(){
  var g=document.getElementById('grid-colabs'); g.innerHTML='';
  KEYS.forEach(function(k,i){
    var nome=NOMES[i],t=tAct(k),em=!!t,pause=em&&t.emPausa,isSel=sel===k;
    var btn=document.createElement('button');
    btn.className='btn-colab'+(isSel?' sel':pause?' pausa-c':'');
    var dc=isSel?'d-sel':pause?'d-pausa':em?'d-turno':'d-livre';
    var ec=isSel?'e-sel':pause?'e-pausa':em?'e-turno':'e-livre';
    var et='Fora de turno';
    if(pause) et='Em pausa · '+mns(Date.now()-t.pausaInicio)+'min';
    else if(em) et='Em turno · '+hr(t.entrada);
    btn.innerHTML='<div class="ch"><div class="dot '+dc+'"></div><div class="cn">'+nome+'</div></div><div class="ce '+ec+'">'+et+'</div>';
    (function(key){ btn.onclick=function(){ click(key); }; })(k);
    g.appendChild(btn);
  });
}

function click(k){
  sel=k; rColabs();
  document.getElementById('dash').classList.add('oculto');
  document.getElementById('acao').classList.add('visivel');
  document.getElementById('nota').value='';
  var i=KEYS.indexOf(k),nome=NOMES[i],t=tAct(k),em=!!t,pause=em&&t.emPausa;
  document.getElementById('ai-nome').textContent=nome;
  var eEl=document.getElementById('ai-est');
  if(!em){ eEl.className='ai-est-l'; eEl.textContent='Fora de turno'; }
  else if(pause){ eEl.className='ai-est-p'; eEl.textContent='Em pausa · '+mns(Date.now()-t.pausaInicio)+'min · desde '+hr(t.entrada); }
  else{ eEl.className='ai-est-t'; eEl.textContent='Em turno há '+fD(hL(t))+' · desde '+hr(t.entrada); }
  var b=document.getElementById('bts'); b.innerHTML='';
  if(!em) b.appendChild(mB('Registar Entrada','ba-ent','entrada'));
  else if(pause){ b.appendChild(mB('Retomar Turno','ba-ret','retoma')); b.appendChild(mB('Registar Saída','ba-sai','saida')); }
  else{ b.appendChild(mB('Iniciar Pausa','ba-pau','pausa')); b.appendChild(mB('Registar Saída','ba-sai','saida')); }
  var bc=document.createElement('button'); bc.className='ba-can'; bc.textContent='Cancelar'; bc.onclick=cancel; b.appendChild(bc);
}
function mB(txt,cls,tipo){ var b=document.createElement('button'); b.className='ba '+cls; b.textContent=txt; b.onclick=function(){ reg(tipo); }; return b; }
function cancel(){ sel=null; rColabs(); document.getElementById('acao').classList.remove('visivel'); document.getElementById('dash').classList.remove('oculto'); }

function reg(tipo){
  if(!sel) return;
  var k=sel,i=KEYS.indexOf(k),nome=NOMES[i],now=new Date(),nota=document.getElementById('nota').value.trim();
  if(!turnos[k]) turnos[k]={entrada:null,saida:null,pausas:[],emPausa:false,pausaInicio:null};
  var t=turnos[k],ic,ti,de;
  if(tipo==='entrada'){ turnos[k]={entrada:now,saida:null,pausas:[],emPausa:false,pausaInicio:null}; ic='✅'; ti='Entrada registada'; de='Bom turno, '+p1(nome)+'!'; }
  else if(tipo==='pausa'){ t.emPausa=true; t.pausaInicio=now; t.pausas.push({inicio:now,fim:null}); ic='☕'; ti='Pausa iniciada'; de='Descansa, '+p1(nome)+'.'; }
  else if(tipo==='retoma'){ t.emPausa=false; var up=t.pausas[t.pausas.length-1]; if(up&&!up.fim)up.fim=now; t.pausaInicio=null; ic='💪'; ti='Turno retomado'; de='De volta, '+p1(nome)+'!'; }
  else if(tipo==='saida'){ t.saida=now; t.emPausa=false; ic='👋'; ti='Saída registada'; de='Total: '+fD(hL(t))+'. Até amanhã, '+p1(nome)+'!'; }
  registos.push({id:Date.now(),k:k,nome:nome,tipo:tipo,hora:now.toISOString(),hf:hr(now),nota:nota||null});
  save(); cancel(); rDash(); rRes();
  document.getElementById('m-ic').textContent=ic;
  document.getElementById('m-ti').textContent=ti;
  document.getElementById('m-ho').textContent=hr(now);
  document.getElementById('m-de').textContent=nota?'"'+nota+'" · '+de:de;
  document.getElementById('ov-ok').classList.add('v');
  if(config.url){
    var h=pad(now.getHours())+':'+pad(now.getMinutes());
    var params='nome='+encodeURIComponent(nome)+'&tipo='+encodeURIComponent(tipo)+'&hora='+encodeURIComponent(h)+(nota?'&nota='+encodeURIComponent(nota):'');
    // Calcular pausa real em minutos ao fazer saída
    if(tipo==='saida'&&t&&t.pausas){
      var totalPausa=0;
      t.pausas.forEach(function(p){if(p.inicio&&p.fim)totalPausa+=Math.floor((new Date(p.fim)-new Date(p.inicio))/60000);});
      if(totalPausa>0)params+='&pausa_real_min='+totalPausa;
    }
    fetch(config.url+'?'+params)
      .then(function(r){ return r.text(); })
      .then(function(t){ console.log('Script resposta:',t); })
      .catch(function(err){ console.log('Erro fetch:',err); });
  }
}

function rDash(){
  var la=document.getElementById('lista-act');
  var act=KEYS.filter(function(k){ return !!tAct(k); });
  if(!act.length){ la.innerHTML='<span class="sem-act">Nenhum colaborador em turno</span>'; return; }
  la.innerHTML=act.map(function(k){
    var t=tAct(k),i=KEYS.indexOf(k),nome=NOMES[i],d=hL(t),pause=t.emPausa,av=!pause&&d>360;
    return '<div class="activo-card'+(pause?' p':'')+'"><div class="ac-row"><div class="ac-nome">'+nome+'</div><div class="'+(pause?'ac-dur-p':'ac-dur')+'">'+(pause?'Pausa':fD(d))+'</div></div><div class="ac-sub">Entrada às '+hr(t.entrada)+(pause?' · '+fD(d)+' trabalhados':'')+'</div>'+(av?'<div class="ac-av">⚠ Sem pausa registada</div>':'')+'</div>';
  }).join('');
}

function rRes(){
  var hoje=new Date().toDateString();
  document.getElementById('res-rows').innerHTML=KEYS.map(function(k,i){
    var nome=NOMES[i],rh=registos.filter(function(r){ return new Date(r.hora).toDateString()===hoje&&r.k===k; }),
        t=turnos[k],d=(t&&t.entrada)?hL(t):0,np=rh.filter(function(r){ return r.tipo==='pausa'; }).length,tr=rh.length>0;
    return '<div class="res-row"><div class="res-n'+(tr?'':' i')+'">'+nome+(np>0?'<span class="tp">'+np+'p</span>':'')+'</div><div class="res-t'+(tr?'':' i')+'">'+(d>0?fD(d):'—')+'</div></div>';
  }).join('');
}

function fModal(){ document.getElementById('ov-ok').classList.remove('v'); }
function aAdm(){
  var hoje=new Date().toDateString(),regs=registos.filter(function(r){ return new Date(r.hora).toDateString()===hoje; }).slice(-40).reverse();
  var tc={entrada:'ENTRADA',saida:'SAÍDA',pausa:'PAUSA',retoma:'RETOMA'},cc={entrada:'le',saida:'ls',pausa:'lp',retoma:'lr'};
  document.getElementById('log-r').innerHTML=regs.length?regs.map(function(r){ return '<span class="'+cc[r.tipo]+'">'+r.hf+' · '+p1(r.nome)+' · '+tc[r.tipo]+(r.nota?' · "'+r.nota+'"':'')+'</span>\n'; }).join(''):'Sem registos hoje.';
  document.getElementById('ov-adm').classList.add('v');
}
function fAdm(){ document.getElementById('ov-adm').classList.remove('v'); }
function gConfig(){ config.url=document.getElementById('i-url').value.trim(); config.email=document.getElementById('i-email').value.trim(); localStorage.setItem('moa_c',JSON.stringify(config)); var s=document.getElementById('ss'); s.textContent='Guardado ✓'; s.className='ok'; }
function expCSV(){ var l=['Nome,Tipo,Data,Hora,Nota']; registos.forEach(function(r){ var d=new Date(r.hora); l.push([r.nome,r.tipo,d.toLocaleDateString('pt-PT'),d.toLocaleTimeString('pt-PT'),r.nota||''].join(',')); }); var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([l.join('\n')],{type:'text/csv'})); a.download='MOA_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); }

function tAct(k){ var t=turnos[k]; return (t&&t.entrada&&!t.saida)?t:null; }
function hL(t){ if(!t||!t.entrada)return 0; var ms=(t.saida?new Date(t.saida):new Date())-new Date(t.entrada); (t.pausas||[]).forEach(function(p){ if(p.inicio&&p.fim)ms-=(new Date(p.fim)-new Date(p.inicio)); }); return Math.max(0,Math.floor(ms/60000)); }
function hr(d){ var n=new Date(d); return pad(n.getHours())+':'+pad(n.getMinutes()); }
function mns(ms){ return Math.floor(ms/60000); }
function fD(m){ var h=Math.floor(m/60),mn=m%60; return h>0?h+'h'+(mn>0?mn+'m':''):mn+'min'; }
function p1(n){ return n.split(' ')[0]; }
function save(){ localStorage.setItem('moa_t',JSON.stringify(turnos)); localStorage.setItem('moa_r',JSON.stringify(registos)); }
function vreset(){
  var hoje=new Date().toDateString();
  if(localStorage.getItem('moa_rd')!==hoje){
    Object.keys(turnos).forEach(function(k){ if(turnos[k].entrada&&!turnos[k].saida){ turnos[k].saida=new Date(); turnos[k].emPausa=false; } });
    turnos={}; save(); localStorage.setItem('moa_rd',hoje);
  }
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ fModal(); fAdm(); } });
window.addEventListener('resize', function(){ if(!localStorage.getItem('moa_zoom')) applyZoom(calcAutoZoom()); });
init();
</script>
</body>
</html>
